<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>gub.uy · Simulador de ingreso</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; color: #1f2933; margin: 0; }
        .caja { max-width: 420px; margin: 4rem auto; background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; padding: 2rem; }
        h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
        .aviso { background: #fff4e5; color: #8a4b00; border-radius: 4px; padding: 0.5rem 0.75rem; font-size: 0.85rem; margin: 1rem 0 1.5rem; }
        label { display: block; font-size: 0.9rem; margin-bottom: 1rem; }
        input { display: block; width: 100%; box-sizing: border-box; margin-top: 0.3rem; padding: 0.55rem 0.7rem; font: inherit; border: 1px solid #cbd2d9; border-radius: 4px; }
        .ayuda { color: #52606d; font-size: 0.8rem; }
        .cancelar { display: block; text-align: center; margin-top: 1rem; color: #0b3d91; font-size: 0.95rem; }
        button { width: 100%; padding: 0.7rem; font: inherit; background: #0b3d91; color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div class="caja">
    <h1>Ingresar con gub.uy</h1>
    <div class="aviso">Simulador para desarrollo: no es el gub.uy real. Los datos que escribas son los que gub.uy le devolvería a carga.uy.</div>

    <!-- Sin action: el simulador espera el POST en la misma URL, con "username" y "claims" -->
    <form method="post" id="formulario">
        <label>Cédula
            <input name="username" id="cedula" placeholder="Ej.: 1.234.567-2" required autofocus>
            <span class="ayuda">Tiene que ser una cédula válida (con dígito verificador correcto).</span>
        </label>
        <label>Nombre completo (opcional)
            <span class="ayuda" id="recordado" hidden>Recordado de un ingreso anterior con esta cédula.</span>
            <input id="nombre" placeholder="Ej.: Ana Pérez">
        </label>
        <label>Correo (opcional)
            <input id="email" type="email" placeholder="Ej.: ana.perez@correo.uy">
            <span class="ayuda">Se sugiere solo a partir del nombre; si lo escribís a mano, se respeta.</span>
        </label>
        <input type="hidden" name="claims" id="claims">
        <button type="submit">Ingresar</button>
    </form>
    <a class="cancelar" id="cancelar" href="#">Cancelar y volver a carga.uy</a>
</div>
<script>
    // Cancelar como lo hace un proveedor OpenID Connect: volver a la aplicación con error=access_denied y el mismo state
    (function () {
        var parametros = new URLSearchParams(window.location.search);
        var redireccion = parametros.get('redirect_uri');
        var enlace = document.getElementById('cancelar');
        if (!redireccion) {
            enlace.style.display = 'none';
            return;
        }
        var destino = new URL(redireccion);
        destino.searchParams.set('error', 'access_denied');
        if (parametros.get('state')) destino.searchParams.set('state', parametros.get('state'));
        enlace.href = destino.toString();
    })();

    // Sugerencia de correo a partir del nombre: "Joaquín Poblete" -> joaquin.poblete@correo.uy
    var campoNombre = document.getElementById('nombre');
    var campoEmail = document.getElementById('email');
    var emailEditadoAMano = false;

    function sugerirEmail(nombre) {
        var usuario = nombre
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')  // saca tildes: í -> i, ñ -> n
            .toLowerCase()
            .trim()
            .replace(/\s+/g, '.')                               // espacios -> puntos
            .replace(/[^a-z0-9.]/g, '')                          // solo letras, números y puntos
            .replace(/\.{2,}/g, '.')
            .replace(/^\.|\.$/g, '');
        return usuario ? usuario + '@correo.uy' : '';
    }

    // El simulador no tiene base de personas: recuerda en este navegador el nombre y correo usados con cada cédula,
    // así no hay que escribirlos en cada ingreso (el gub.uy real ya los conoce).
    var campoCedula = document.getElementById('cedula');
    var avisoRecordado = document.getElementById('recordado');

    function claveRecordada(cedula) {
        return 'simulador-gubuy:' + cedula.replace(/[^0-9]/g, '');
    }

    function completarRecordado() {
        var cedula = campoCedula.value.trim();
        if (!cedula) return;
        try {
            var guardado = JSON.parse(localStorage.getItem(claveRecordada(cedula)) || 'null');
            if (guardado && !campoNombre.value && !campoEmail.value) {
                campoNombre.value = guardado.nombre || '';
                campoEmail.value = guardado.email || '';
                emailEditadoAMano = !!guardado.email;
                avisoRecordado.hidden = false;
            }
        } catch (e) {
            // si el navegador no deja usar localStorage, simplemente no se recuerda
        }
    }

    campoCedula.addEventListener('change', completarRecordado);
    campoCedula.addEventListener('blur', completarRecordado);

    campoNombre.addEventListener('input', function () {
        if (!emailEditadoAMano) {
            campoEmail.value = sugerirEmail(campoNombre.value);
        }
    });
    campoEmail.addEventListener('input', function () {
        // Si lo borra entero, vuelve a sugerir
        emailEditadoAMano = campoEmail.value.trim() !== '';
    });

    // Arma los claims con los mismos nombres que usa ID Uruguay
    document.getElementById('formulario').addEventListener('submit', function () {
        var claims = {};
        var nombre = document.getElementById('nombre').value.trim();
        var email = document.getElementById('email').value.trim();
        if (nombre) claims.nombre_completo = nombre;
        if (email) claims.email = email;
        if (nombre || email) {
            try {
                localStorage.setItem(claveRecordada(campoCedula.value.trim()), JSON.stringify({ nombre: nombre, email: email }));
            } catch (e) {
                // sin localStorage no se recuerda, y no pasa nada
            }
        }
        document.getElementById('claims').value = Object.keys(claims).length ? JSON.stringify(claims) : '';
    });
</script>
</body>
</html>
