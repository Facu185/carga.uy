# Verifica que main siempre compile y pase las pruebas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y probar
        run: mvn -B -ntp clean verify

      - name: Guardar el EAR
        uses: actions/upload-artifact@v4
        with:
          name: carga-ear
          path: carga-ear/target/carga.ear
          if-no-files-found: error
