# Verifica que main siempre compile y pase las pruebas.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y probar
        run: mvn -B -ntp clean verify

      - name: Guardar el EAR
        uses: actions/upload-artifact@v4
        with:
          name: carga-ear
          path: carga-ear/target/carga.ear
          if-no-files-found: error

  # Frontend React (ADR 0004): compila con TypeScript estricto y pasa el linter.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: carga-front
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: carga-front/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar
        run: npm run build

  # Pruebas de verdad: migraciones contra PostgreSQL real (Testcontainers) y el sistema completo
  # levantado con docker compose, recorrido con pedidos HTTP (login, roles, gub.uy, PDI, auditoria).
  integracion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Migraciones contra PostgreSQL real
        run: mvn -B -ntp -Pintegracion -pl carga-ejb -am verify

      - name: Levantar el sistema
        run: docker compose up -d --build

      - name: Prueba de punta a punta
        run: ./pruebas/punta-a-punta.sh

      - name: Logs del central (si fallo)
        if: failure()
        run: docker compose logs --no-color central | tail -n 200

      - name: Bajar el sistema
        if: always()
        run: docker compose down -v
