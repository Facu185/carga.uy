server {
  # HTTP en desarrollo. En la nube el TLS lo termina la plataforma delante de este contenedor
  # (pendiente decidir con el grupo si en local tambien va HTTPS).
  listen 80;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  root /usr/share/nginx/html;

  # La API va al central por la misma URL: el navegador ve un solo origen, no hace falta CORS (ADR 0004).
  location /carga/ {
    proxy_pass http://central:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: cualquier ruta desconocida devuelve index.html y la resuelve React Router
  location / {
    try_files $uri /index.html;
  }
}
