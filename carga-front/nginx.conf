# En la nube (Elastic Cloud) el TLS lo termina el balanceador de la plataforma delante de este
# contenedor y avisa por X-Forwarded-Proto si el pedido llego por http o por https. En desarrollo no
# hay balanceador: el header no viene y todo sigue por http.
map $http_x_forwarded_proto $esquema_original {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Detras del balanceador con SSL, todo pedido que llego por http se manda a https (letra 4.2, punto 2)
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  root /usr/share/nginx/html;

  # Los nombres de los contenedores se resuelven con el DNS de Docker en cada pedido (no una sola vez al
  # arrancar): si central o keycloak se recrean y cambian de IP, nginx no queda apuntando a la vieja.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $central http://central:8080;
  set $keycloak http://keycloak:8080;

  # La API va al central por la misma URL: el navegador ve un solo origen, no hace falta CORS (ADR 0004).
  location /carga/ {
    proxy_pass $central;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_original;
  }

  # Keycloak (en lugar de gub.uy, ADR-0026) por el mismo dominio: en la nube no hace falta publicar otro
  # puerto. El central le habla directo por la red interna (GUBUY_ISSUER); por aca solo pasa el navegador
  # (pantalla de ingreso del realm gubuy).
  location /gubuy/ {
    proxy_pass $keycloak;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_original;
    # Keycloak responde con encabezados grandes (cookies de sesion): sin esto nginx corta con 502
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
  }

  # La consola de administracion y el realm master de Keycloak no se publican: se usan por el puerto 8085
  location ^~ /gubuy/admin/ {
    return 404;
  }
  location ^~ /gubuy/realms/master/ {
    return 404;
  }

  # SPA: cualquier ruta desconocida devuelve index.html y la resuelve React Router
  location / {
    try_files $uri /index.html;
  }
}
