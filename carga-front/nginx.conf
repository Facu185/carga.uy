# En la nube (Elastic Cloud) el TLS lo termina el balanceador de la plataforma delante de este
# contenedor y avisa por X-Forwarded-Proto si el pedido llego por http o por https. En desarrollo no
# hay balanceador: el header no viene y todo sigue por http.
map $http_x_forwarded_proto $esquema_original {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Detras del balanceador con SSL, todo pedido que llego por http se manda a https (letra 4.2, punto 2)
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  root /usr/share/nginx/html;

  # La API va al central por la misma URL: el navegador ve un solo origen, no hace falta CORS (ADR 0004).
  location /carga/ {
    proxy_pass http://central:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_original;
  }

  # Simulador de gub.uy por el mismo dominio: en la nube no hace falta publicar otro puerto. El central
  # le habla directo por la red interna (GUBUY_ISSUER); por aca solo pasa el navegador (pantalla de ingreso).
  location /gubuy/ {
    proxy_pass http://gubuy-simulador:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $esquema_original;
  }

  # SPA: cualquier ruta desconocida devuelve index.html y la resuelve React Router
  location / {
    try_files $uri /index.html;
  }
}
