# Ajustes para la prueba de performance (P4). Se suma al compose principal:
#   docker compose -f docker-compose.yml -f docker-compose.performance.yml --profile monitoreo up -d
# - Limita el central a 2 CPU y 2 GB, para que los resultados no dependan de la maquina donde se corre
#   y se parezcan a una instancia de Elastic Cloud. Ajustar cuando se conozca el tamano real.
# - Activa pg_stat_statements en Postgres, que registra cuanto tiempo consume cada consulta SQL.
services:
  central:
    cpus: 2
    mem_limit: 2g

  db:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
