# ID Uruguay real, ambiente TESTING. El simulador sigue siendo el default del Compose base.
# Uso y validacion manual: docs/integracion-id-uruguay-testing.md
# Este archivo no contiene secretos ni habilita produccion.
services:
  central:
    environment:
      GUBUY_ISSUER: https://auth-testing.iduruguay.gub.uy/oidc/v1
      # Vacio explicitamente: usar authorization_endpoint de discovery, NO el simulador del base.
      GUBUY_AUTHORIZATION_ENDPOINT: ""
      GUBUY_CLIENT_ID: "890192"
      GUBUY_CLIENT_SECRET: ${GUBUY_CLIENT_SECRET:?Definir GUBUY_CLIENT_SECRET en .env con el secreto vigente de testing}
      # URI registrada exacta, con la barra final; Undertow reenvia la raiz al callback interno.
      GUBUY_REDIRECT_URI: http://localhost:8080/
      GUBUY_SCOPES: openid personal_info email document
