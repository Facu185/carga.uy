# Levanta el sistema completo:
#   db        PostgreSQL + PostGIS
#   central   WildFly con carga.ear y el simulador de la PDI
#   balanzas  nodo periferico (request-response)
#   tracking  nodo periferico (emite eventos)
#   frontend  React (backoffice y frontoffice) + nginx, mismo origen que la API
#   keycloak  IdP OpenID Connect que reemplaza a gub.uy en desarrollo (ADR-0026)
#   ldap      directorio del MTOP (opcional: COMPOSE_PROFILES=ldap en el .env)
#   jaeger    trazas distribuidas (OpenTelemetry)
#
#   docker compose up -d --build
#   http://localhost:8080/carga/   (central)
#   http://localhost:3000/         (frontend)
#   http://localhost:16686/        (Jaeger: trazas)
#   http://localhost:8085/gubuy/admin/  (Keycloak: usuarios de gub.uy)
#
# Los valores de entorno salen de .env (copiar de .env.example).

services:

  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-carga}
      POSTGRES_USER: ${DB_USER:-carga}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carga}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-carga} -d ${DB_NAME:-carga}"]
      interval: 5s
      timeout: 3s
      retries: 15

  central:
    build:
      context: .
      dockerfile: docker/central/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-carga}
      DB_USER: ${DB_USER:-carga}
      DB_PASSWORD: ${DB_PASSWORD:-carga}
      NODO_BALANZAS_URL: http://balanzas:8080/balanzas/api/pesadas
      # Tokens compartidos con los nodos perifericos (ADR-0007). Los default son de desarrollo.
      NODO_BALANZAS_TOKEN: ${NODO_BALANZAS_TOKEN:-balanzas-solo-desarrollo}
      NODO_TRACKING_TOKEN: ${NODO_TRACKING_TOKEN:-tracking-solo-desarrollo}
      # Saturacion de la ingesta de posiciones (ADR-0008). Los default son los del volumen estimado.
      TRACKING_COLA_UMBRAL_ALTO: ${TRACKING_COLA_UMBRAL_ALTO:-18000}
      TRACKING_COLA_UMBRAL_BAJO: ${TRACKING_COLA_UMBRAL_BAJO:-9000}
      TRACKING_REINTENTAR_SEG: ${TRACKING_REINTENTAR_SEG:-30}
      TRACKING_LOTE_MAX: ${TRACKING_LOTE_MAX:-500}
      SIMULADOR_PDI_URL: http://localhost:8080/simulador-pdi/ServicioDnicImpl?wsdl
      PDI_TIMEOUT_MS: ${PDI_TIMEOUT_MS:-3000}
      PDI_REINTENTOS: ${PDI_REINTENTOS:-1}
      PDI_CIRCUITO_UMBRAL: ${PDI_CIRCUITO_UMBRAL:-3}
      PDI_CIRCUITO_ESPERA_SEG: ${PDI_CIRCUITO_ESPERA_SEG:-30}
      # Vista previa de guias: la clave nunca se entrega al contenedor frontend.
      ORS_API_KEY: ${ORS_API_KEY:-}
      IDE_DIRECCIONES_URL: ${IDE_DIRECCIONES_URL:-https://direcciones.ide.uy/api/v1/geocode}
      ORS_RUTAS_URL: ${ORS_RUTAS_URL:-https://api.heigit.org/openrouteservice/v2/directions/driving-hgv/geojson}
      # --- Seguridad (P1). Los default son SOLO para desarrollo: en la nube se sobrescriben. ---
      JWT_SECRET: ${JWT_SECRET:-solo-desarrollo-cambiar-en-la-nube-0123456789}
      JWT_DURACION_MINUTOS: ${JWT_DURACION_MINUTOS:-30}
      ADMIN_INICIAL_USUARIO: ${ADMIN_INICIAL_USUARIO:-admin}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-admin-solo-desarrollo}
      # Backoffice: "bd" (default) o "ldap" (opcional, ADR 0003)
      AUTENTICACION_INTERNA: ${AUTENTICACION_INTERNA:-bd}
      LDAP_URL: ${LDAP_URL:-ldap://ldap:389}
      LDAP_USUARIOS_DN: ${LDAP_USUARIOS_DN:-ou=usuarios,dc=mtop,dc=gub,dc=uy}
      LDAP_GRUPOS_DN: ${LDAP_GRUPOS_DN:-ou=grupos,dc=mtop,dc=gub,dc=uy}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=lectura,dc=mtop,dc=gub,dc=uy}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-lectura-solo-desarrollo}
      LDAP_GRUPO_ADMINISTRADORES_DN: ${LDAP_GRUPO_ADMINISTRADORES_DN:-cn=administradores,ou=grupos,dc=mtop,dc=gub,dc=uy}
      LDAP_GRUPO_AUTORIDADES_DN: ${LDAP_GRUPO_AUTORIDADES_DN:-cn=autoridades,ou=grupos,dc=mtop,dc=gub,dc=uy}
      # gub.uy (OpenID Connect). Por defecto, el Keycloak de desarrollo (ADR-0026); para ID Uruguay real,
      # sobrescribir en .env (y dejar GUBUY_DISCOVERY_URL vacio). El emisor es la URL publica de Keycloak
      # (por donde entra el navegador, via nginx /gubuy/); el central lo lee por la red interna.
      GUBUY_ISSUER: ${GUBUY_ISSUER:-${KEYCLOAK_URL_PUBLICA:-http://localhost:3000/gubuy}/realms/gubuy}
      GUBUY_DISCOVERY_URL: ${GUBUY_DISCOVERY_URL-http://keycloak:8080/gubuy/realms/gubuy/.well-known/openid-configuration}
      GUBUY_AUTHORIZATION_ENDPOINT: ${GUBUY_AUTHORIZATION_ENDPOINT-}
      GUBUY_CLIENT_ID: ${GUBUY_CLIENT_ID:-carga-uy-local}
      GUBUY_CLIENT_SECRET: ${GUBUY_CLIENT_SECRET:-secreto-solo-desarrollo}
      GUBUY_REDIRECT_URI: ${GUBUY_REDIRECT_URI:-http://localhost:3000/carga/api/auth/gubuy/callback}
      GUBUY_SCOPES: ${GUBUY_SCOPES:-openid personal_info email document}
      FRONTEND_URL_WEB: ${FRONTEND_URL_WEB:-http://localhost:3000}
      FRONTEND_URL_MOVIL: ${FRONTEND_URL_MOVIL:-cargauy://ingreso}
      # Trazas distribuidas (OTLP/HTTP). Vacio = no exportar.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    ports:
      - "8080:8080"   # aplicacion
      - "9990:9990"   # consola de administracion de WildFly
    depends_on:
      db:
        condition: service_healthy

  balanzas:
    build:
      context: .
      dockerfile: docker/balanzas/Dockerfile
    environment:
      # Para probar el comportamiento del central ante un nodo lento o caido:
      BALANZAS_DEMORA_MS: "0"
      BALANZAS_FALLA: "false"
      NODO_TOKEN: ${NODO_BALANZAS_TOKEN:-balanzas-solo-desarrollo}
      # Exporta su tramo de la traza distribuida a Jaeger (vacio = no exportar)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    ports:
      - "8081:8080"

  tracking:
    build:
      context: .
      dockerfile: docker/tracking/Dockerfile
    environment:
      CENTRAL_INGESTA_URL: http://central:8080/carga/api/tracking/posiciones
      TRACKING_INTERVALO_MS: ${TRACKING_INTERVALO_MS:-5000}
      NODO_TOKEN: ${NODO_TRACKING_TOKEN:-tracking-solo-desarrollo}
    depends_on:
      - central

  # Generador de carga para la prueba de performance (P4, ADR-0008). NO arranca con "docker compose up":
  #   docker compose --profile carga run --build --rm generador
  # Los parametros (GEN_ESCENARIO, GEN_VEHICULOS, ...) se pasan con -e; ver el README.
  # El CSV con los resultados queda en la carpeta resultados-carga/ del proyecto.
  generador:
    build:
      context: .
      dockerfile: docker/generador/Dockerfile
    profiles: ["carga"]
    environment:
      CENTRAL_INGESTA_URL: http://central:8080/carga/api/tracking/posiciones
      CENTRAL_METRICAS_URL: http://central:8080/carga/api/metricas
      NODO_TOKEN: ${NODO_TRACKING_TOKEN:-tracking-solo-desarrollo}
    volumes:
      - ./resultados-carga:/resultados

  # Frontend React servido por nginx. /carga/* se reenvia al central: un solo origen, sin CORS (ADR 0004).
  frontend:
    build:
      context: carga-front
    ports:
      # En la nube (Elastic Cloud) FRONTEND_PUERTO=80: el dominio y el SSL del entorno entran por el 80
      - "${FRONTEND_PUERTO:-3000}:80"
    depends_on:
      - central

  # Keycloak en lugar de gub.uy (ADR-0026): realm "gubuy" con el cliente de carga.uy, los scopes de ID Uruguay
  # (personal_info, email, document), los mismos datos en UserInfo (numero_documento, nombre_completo, email)
  # y usuarios de prueba (docker/keycloak/gubuy-realm.json; clave: carga-solo-desarrollo).
  # - Todo bajo /gubuy: nginx lo publica en el mismo dominio que la app, tambien con HTTPS en la nube.
  # - El realm se importa en cada arranque: los usuarios permanentes van en el JSON. Los que se crean desde la
  #   consola duran hasta que se recrea el contenedor.
  # - Consola de administracion: http://localhost:8085/gubuy/admin/ (nginx no la publica).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USUARIO:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-solo-desarrollo}
      KC_HTTP_RELATIVE_PATH: /gubuy
      # Emisor de los tokens = URL publica (por donde entra el navegador). En la nube: https://<entorno>/gubuy
      KC_HOSTNAME: ${KEYCLOAK_URL_PUBLICA:-http://localhost:3000/gubuy}
      # El central le pide tokens, claves y UserInfo por la red interna (http://keycloak:8080)
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_URL_ADMIN:-http://localhost:8085/gubuy}
      # Detras de nginx (y del balanceador en la nube): toma el esquema y el cliente de X-Forwarded-*
      KC_PROXY_HEADERS: xforwarded
      # El realm toma de aca el secreto del cliente y la URL de vuelta de la nube (los mismos que usa el central)
      GUBUY_CLIENT_SECRET: ${GUBUY_CLIENT_SECRET:-secreto-solo-desarrollo}
      GUBUY_REDIRECT_URI: ${GUBUY_REDIRECT_URI:-http://localhost:3000/carga/api/auth/gubuy/callback}
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8085:8080"

  # Directorio LDAP de desarrollo, solo para AUTENTICACION_INTERNA=ldap (opcional, ADR 0003).
  # - Perfil "ldap": solo arranca con COMPOSE_PROFILES=ldap en el .env.
  # - Sin puerto publicado: solo el central le habla, dentro de la red de Docker.
  # - osixia/openldap solo existe para amd64: en Mac con Apple Silicon, Docker la emula.
  # - LDAP_READONLY_USER crea cn=lectura,<base>: el central busca con esa cuenta de solo lectura.
  ldap:
    image: osixia/openldap:1.5.0
    platform: linux/amd64
    profiles: ["ldap"]
    command: --copy-service
    environment:
      LDAP_ORGANISATION: MTOP
      LDAP_DOMAIN: mtop.gub.uy
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin-solo-desarrollo}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: lectura
      LDAP_READONLY_USER_PASSWORD: ${LDAP_BIND_PASSWORD:-lectura-solo-desarrollo}
      LDAP_TLS: "false"
    volumes:
      - ./docker/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro

  # Recibe las trazas por OTLP (puerto 4318, solo dentro de la red) y las muestra en http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  # Monitoreo para la prueba de performance (P4). NO arranca con "docker compose up":
  #   docker compose --profile monitoreo up -d
  # Prometheus guarda las metricas del central cada 5 s (http://localhost:9090) y Grafana las grafica
  # con un tablero ya armado (http://localhost:3001, sin login).
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [ "monitoreo" ]
    command: [ "--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d" ]
    volumes:
      - ./docker/monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-datos:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [ "monitoreo" ]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/carga-uy-performance.json
    volumes:
      - ./docker/monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoreo/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"

volumes:
  pgdata:
  prometheus-datos:
