# Levanta el sistema completo:
#   db        PostgreSQL + PostGIS
#   central   WildFly con carga.ear y el simulador de la PDI
#   balanzas  nodo periferico (request-response)
#   tracking  nodo periferico (emite eventos)
#   frontend  React (backoffice y frontoffice) + nginx, mismo origen que la API
#   gubuy-simulador  IdP OpenID Connect que imita a gub.uy
#   ldap      directorio del MTOP (opcional: COMPOSE_PROFILES=ldap en el .env)
#   jaeger    trazas distribuidas (OpenTelemetry)
#
#   docker compose up -d --build
#   http://localhost:8080/carga/   (central)
#   http://localhost:3000/         (frontend)
#   http://localhost:16686/        (Jaeger: trazas)
#
# Los valores de entorno salen de .env (copiar de .env.example).

services:

  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${DB_NAME:-carga}
      POSTGRES_USER: ${DB_USER:-carga}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-carga}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-carga} -d ${DB_NAME:-carga}"]
      interval: 5s
      timeout: 3s
      retries: 15

  central:
    build:
      context: .
      dockerfile: docker/central/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-carga}
      DB_USER: ${DB_USER:-carga}
      DB_PASSWORD: ${DB_PASSWORD:-carga}
      NODO_BALANZAS_URL: http://balanzas:8080/balanzas/api/pesadas
      # Tokens compartidos con los nodos perifericos (ADR-0007). Los default son de desarrollo.
      NODO_BALANZAS_TOKEN: ${NODO_BALANZAS_TOKEN:-balanzas-solo-desarrollo}
      NODO_TRACKING_TOKEN: ${NODO_TRACKING_TOKEN:-tracking-solo-desarrollo}
      SIMULADOR_PDI_URL: http://localhost:8080/simulador-pdi/ServicioDnicImpl?wsdl
      PDI_TIMEOUT_MS: ${PDI_TIMEOUT_MS:-3000}
      PDI_REINTENTOS: ${PDI_REINTENTOS:-1}
      PDI_CIRCUITO_UMBRAL: ${PDI_CIRCUITO_UMBRAL:-3}
      PDI_CIRCUITO_ESPERA_SEG: ${PDI_CIRCUITO_ESPERA_SEG:-30}
      # --- Seguridad (P1). Los default son SOLO para desarrollo: en la nube se sobrescriben. ---
      JWT_SECRET: ${JWT_SECRET:-solo-desarrollo-cambiar-en-la-nube-0123456789}
      JWT_DURACION_MINUTOS: ${JWT_DURACION_MINUTOS:-30}
      ADMIN_INICIAL_USUARIO: ${ADMIN_INICIAL_USUARIO:-admin}
      ADMIN_INICIAL_PASSWORD: ${ADMIN_INICIAL_PASSWORD:-admin-solo-desarrollo}
      # Backoffice: "bd" (default) o "ldap" (opcional, ADR 0003)
      AUTENTICACION_INTERNA: ${AUTENTICACION_INTERNA:-bd}
      LDAP_URL: ${LDAP_URL:-ldap://ldap:389}
      LDAP_USUARIOS_DN: ${LDAP_USUARIOS_DN:-ou=usuarios,dc=mtop,dc=gub,dc=uy}
      LDAP_GRUPOS_DN: ${LDAP_GRUPOS_DN:-ou=grupos,dc=mtop,dc=gub,dc=uy}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=lectura,dc=mtop,dc=gub,dc=uy}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-lectura-solo-desarrollo}
      LDAP_GRUPO_ADMINISTRADORES_DN: ${LDAP_GRUPO_ADMINISTRADORES_DN:-cn=administradores,ou=grupos,dc=mtop,dc=gub,dc=uy}
      LDAP_GRUPO_AUTORIDADES_DN: ${LDAP_GRUPO_AUTORIDADES_DN:-cn=autoridades,ou=grupos,dc=mtop,dc=gub,dc=uy}
      # gub.uy (OpenID Connect). Por defecto, el simulador; para ID Uruguay real, sobrescribir en .env
      GUBUY_ISSUER: ${GUBUY_ISSUER:-http://gubuy-simulador:8080/gubuy}
      GUBUY_AUTHORIZATION_ENDPOINT: ${GUBUY_AUTHORIZATION_ENDPOINT-http://localhost:8085/gubuy/authorize}
      GUBUY_CLIENT_ID: ${GUBUY_CLIENT_ID:-carga-uy-local}
      GUBUY_CLIENT_SECRET: ${GUBUY_CLIENT_SECRET:-secreto-solo-desarrollo}
      GUBUY_REDIRECT_URI: ${GUBUY_REDIRECT_URI:-http://localhost:3000/carga/api/auth/gubuy/callback}
      GUBUY_SCOPES: ${GUBUY_SCOPES:-openid personal_info email document}
      FRONTEND_URL_WEB: ${FRONTEND_URL_WEB:-http://localhost:3000}
      FRONTEND_URL_MOVIL: ${FRONTEND_URL_MOVIL:-cargauy://ingreso}
      # Trazas distribuidas (OTLP/HTTP). Vacio = no exportar.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://jaeger:4318}
    ports:
      - "8080:8080"   # aplicacion
      - "9990:9990"   # consola de administracion de WildFly
    depends_on:
      db:
        condition: service_healthy

  balanzas:
    build:
      context: .
      dockerfile: docker/balanzas/Dockerfile
    environment:
      # Para probar el comportamiento del central ante un nodo lento o caido:
      BALANZAS_DEMORA_MS: "0"
      BALANZAS_FALLA: "false"
      NODO_TOKEN: ${NODO_BALANZAS_TOKEN:-balanzas-solo-desarrollo}
    ports:
      - "8081:8080"

  tracking:
    build:
      context: .
      dockerfile: docker/tracking/Dockerfile
    environment:
      CENTRAL_INGESTA_URL: http://central:8080/carga/api/tracking/posiciones
      TRACKING_INTERVALO_MS: ${TRACKING_INTERVALO_MS:-5000}
      NODO_TOKEN: ${NODO_TRACKING_TOKEN:-tracking-solo-desarrollo}
    depends_on:
      - central

  # Frontend React servido por nginx. /carga/* se reenvia al central: un solo origen, sin CORS (ADR 0004).
  frontend:
    build:
      context: carga-front
    ports:
      - "3000:80"
    depends_on:
      - central

  # Simula el IdP de gub.uy (OpenID Connect) con los mismos claims que ID Uruguay.
  # Pantalla de login propia (login.html): cedula, nombre y correo.
  gubuy-simulador:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    environment:
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./docker/gubuy-simulador:/config:ro
    ports:
      - "8085:8080"

  # Directorio LDAP de desarrollo, solo para AUTENTICACION_INTERNA=ldap (opcional, ADR 0003).
  # - Perfil "ldap": solo arranca con COMPOSE_PROFILES=ldap en el .env.
  # - Sin puerto publicado: solo el central le habla, dentro de la red de Docker.
  # - osixia/openldap solo existe para amd64: en Mac con Apple Silicon, Docker la emula.
  # - LDAP_READONLY_USER crea cn=lectura,<base>: el central busca con esa cuenta de solo lectura.
  ldap:
    image: osixia/openldap:1.5.0
    platform: linux/amd64
    profiles: ["ldap"]
    command: --copy-service
    environment:
      LDAP_ORGANISATION: MTOP
      LDAP_DOMAIN: mtop.gub.uy
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin-solo-desarrollo}
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: lectura
      LDAP_READONLY_USER_PASSWORD: ${LDAP_BIND_PASSWORD:-lectura-solo-desarrollo}
      LDAP_TLS: "false"
    volumes:
      - ./docker/ldap/seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro

  # Recibe las trazas por OTLP (puerto 4318, solo dentro de la red) y las muestra en http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

volumes:
  pgdata:
